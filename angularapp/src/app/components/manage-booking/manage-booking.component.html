<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Bookings - SkyBooker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://images.squarespace-cdn.com/content/v1/5e72c8bfe21ad940ba788673/1620737720518-FF8WLWP07MAWXXCT0SI1/agoda-flight-booking-thumbnail.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #007BFF;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    .container {
      background-color: rgba(255, 255, 255, 0.95);
      margin: 50px auto;
      padding: 30px;
      max-width: 1000px;
      border-radius: 10px;
    }
    h1 {
      color: #007BFF;
      text-align: center;
    }
    .booking-card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .booking-row {
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .booking-label {
      flex: 1 1 150px;
      font-weight: bold;
    }
    .booking-value {
      flex: 2 1 300px;
    }
    .actions {
      margin-top: 15px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
      margin-right: 10px;
    }
    .approve {
      background-color: #28a745;
    }
    .reject {
      background-color: #dc3545;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Manage Bookings</h1>
  
    <div *ngFor="let booking of filteredBookings()" class="booking-card">
      <div class="booking-row">
        <div class="booking-label">Booking ID:</div>
        <div class="booking-value">{{ booking.bookingId }}</div>
      </div>
      <div class="booking-row">
        <div class="booking-label">User ID:</div>
        <div class="booking-value">{{ booking.userId }}</div>
      </div>
      <div class="booking-row">
        <div class="booking-label">Booking Date:</div>
        <div class="booking-value">{{ booking.bookingDate | date : 'dd-MM-yyyy' }}</div>
      </div>
      <div class="booking-row">
        <div class="booking-label">Passengers:</div>
        <div class="booking-value">{{ booking.numberOfPassengers }}</div>
      </div>
      <div class="booking-row">
        <div class="booking-label">Status:</div>
        <div class="booking-value">{{ booking.status }}</div>
      </div>
      <div class="actions">
        <button class="btn approve" (click)="confirmBooking(booking.bookingId)">Approve</button>
        <button class="btn reject" (click)="cancelBooking(booking.bookingId)">Cancel</button>
      </div>
    </div>
  </div>
  </body>
</html>
